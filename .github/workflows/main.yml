name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'Your Agent Name'
        required: true
        default: 'razzy_agent'
      agent_description:
        description: 'Agent Description'
        required: true
        default: 'AI Agent for Billions Network'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Step 1 - Install ClawHub skill
        run: npx clawhub@latest install verified-agent-identity

      - name: Install script dependencies
        run: |
          if [ -d "scripts" ]; then
            cd scripts
            npm install
          else
            echo "Error: scripts folder not found!"
            exit 1
          fi

      - name: Step 2 - Create new Ethereum Identity
        run: node scripts/createNewEthereumIdentity.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Step 3 - Link Human to Agent
        run: |
          node scripts/manualLinkHumanToAgent.js --challenge '{"name": "${{ github.event.inputs.agent_name }}", "description": "${{ github.event.inputs.agent_description }}"}'
